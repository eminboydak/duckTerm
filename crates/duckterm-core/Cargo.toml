[package]
name = "duckterm-core"
version = "0.1.0"
edition = "2021"
description = "Shared serial I/O, protocol, and buffer logic for duckTerm"

[dependencies]
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
mock = []
