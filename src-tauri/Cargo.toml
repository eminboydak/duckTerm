[package]
name = "duckterm"
version = "0.1.0"
description = "A serial terminal application for embedded engineers"
authors = ["Emin Boydak"]
edition = "2021"

[lib]
name = "duckterm_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-serialport = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[features]
default = []
mock = []

[dev-dependencies]
tempfile = "3"
